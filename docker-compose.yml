version: '3.8'

services:
  pcclub-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_PATH=/app/data/pcclub.db
      - READ_TIMEOUT=30s
      - WRITE_TIMEOUT=30s
      - IDLE_TIMEOUT=120s
      - DB_MAX_OPEN_CONNS=50
      - DB_MAX_IDLE_CONNS=10
      - JWT_SECRET=${JWT_SECRET:-pcclub-production-secret-change-me}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-admin-token-change-me}
      - SEED_DEMO_DATA=false
    volumes:
      - pcclub_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - pcclub-server
    restart: unless-stopped
    profiles:
      - production

volumes:
  pcclub_data:
    driver: local